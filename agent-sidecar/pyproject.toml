[project]
name = "papyrus-agent"
version = "0.1.0"
description = "Papyrus agentic document workflow runtime"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",

    # API
    "fastapi==0.121.3",
    "uvicorn[standard]==0.38.0",

    # LLM integration
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    "langgraph==1.0.3",

    # OCR and image processing
    "numpy>=2.0",
    "opencv-python-headless>=4.10",

    # Configuration
    "python-dotenv>=1.0",
]

[project.scripts]
papyrus-agent = "papyrus_agent.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papyrus_agent"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["papyrus_agent"]
